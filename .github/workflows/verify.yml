name: Verify ternary finite-field RH analogue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  exact-finite-field-verification:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exhaustive characteristic-three arithmetic and brute-force checks
        run: python -m unittest -v test_finite_ternary_weil.py
      - name: Download immutable Host8 room slices
        run: |
          mkdir -p /tmp/asolaria-host8
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/JesseBrown1980/finite-reversible-ternary-physics/5a7e9a23dcacdea6fac3c5fa9d5db3069e82e9e3/data/host8_samples/sector-000.rooms" -o "/tmp/asolaria-host8/sector-000.rooms"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/JesseBrown1980/finite-reversible-ternary-physics/5a7e9a23dcacdea6fac3c5fa9d5db3069e82e9e3/data/host8_samples/sector-187.rooms" -o "/tmp/asolaria-host8/sector-187.rooms"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/JesseBrown1980/finite-reversible-ternary-physics/5a7e9a23dcacdea6fac3c5fa9d5db3069e82e9e3/data/host8_samples/sector-374.rooms" -o "/tmp/asolaria-host8/sector-374.rooms"
      - name: Authenticate Host8 hashes and recompute all curves
        run: python host8_ternary_weil.py --host8-dir /tmp/asolaria-host8 --output-dir /tmp/asolaria-recomputed
      - name: Exact modular falsification controls and authenticated Host8 spectral diagonalization
        run: python verify_ternary_spectral_controls.py --host8-dir /tmp/asolaria-host8 --output-dir /tmp/asolaria-recomputed
      - name: Build exact 4x4 Frobenius companion matrices and independently count F243 / F729 points
        run: python verify_frobenius_companion.py --output /tmp/asolaria-recomputed/frobenius_companion_predictions.csv
      - name: Compare recorded tables semantically
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          for name in ('all_quintics.csv', 'host8_curve_results.csv', 'spectral_falsification_controls.csv', 'host8_spectral_common_inputs.csv', 'frobenius_companion_predictions.csv'):
              with Path('results',name).open(newline='') as f:
                  original=list(csv.DictReader(f))
              with Path('/tmp/asolaria-recomputed',name).open(newline='') as f:
                  reproduced=list(csv.DictReader(f))
              assert original==reproduced, name
              print('PASS',name,len(original),'rows')
          PY
